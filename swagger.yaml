openapi: 3.2.0
info:
  title: My first API of POSTS
  description: |-
    API de postagens
  termsOfService: https://swagger.io/terms/
  contact:
    email: dtagliari@uricer.edu.br
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.13
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
servers:
  - url: http://localhost:3000/
    description: My Local server
paths:
  /postagem:
    put:
      tags:
        - postagem
      summary: Update an existing postagem.
      description: Update an existing postagem by Id.
      operationId: updatepostagem
      requestBody:
        description: Update an existent postagem in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Postagem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Postagem'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Postagem'
            application/xml:
              schema:
                $ref: '#/components/schemas/Postagem'
        '400':
          description: Invalid ID supplied
        '404':
          description: postagem not found
        '422':
          description: Validation exception
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - postagenstore_auth:
            - write:postagens
            - read:postagens
    post:
      tags:
        - postagem
      summary: Add a new postagem to the store.
      description: Add a new postagem to the store.
      operationId: addpostagem
      requestBody:
        description: Create a new postagem in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Postagem'
          application/xml:
            schema:
              $ref: '#/components/schemas/Postagem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Postagem'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Postagem'
            application/xml:
              schema:
                $ref: '#/components/schemas/Postagem'
        '400':
          description: Invalid input
        '422':
          description: Validation exception
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - postagenstore_auth:
            - write:postagens
            - read:postagens
  /postagem/{postagemId}:
    get:
      tags:
        - postagem
      summary: Find postagem by identifier.
      description: Returns a single postagem.
      operationId: getpostagemById
      parameters:
        - name: postagemId
          in: path
          description: ID of postagem to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Postagem'
        '400':
          description: Invalid ID supplied
        '404':
          description: postagem not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []
        - postagenstore_auth:
            - write:postagens
            - read:postagens
    delete:
      tags:
        - postagem
      summary: Deletes a postagem.
      description: delete a postagem.
      operationId: deletepostagem
      parameters:
        - name: api_key
          in: header
          description: ''
          required: false
          schema:
            type: string
        - name: postagemId
          in: path
          description: postagem id to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid postagem value
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - postagenstore_auth:
            - write:postagens
            - read:postagens
 

components:
  schemas:
    Postagem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: [10]
        titulo:
          type: string
          examples: [Esse é meu primeiro post]
        descricao:
          type: string
          examples: [Esse é meu primeiro post]
        autor:
          type: string
          examples: [Tagliari]
        dataPublicacao:
          type: string
          format: date-time    
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
      xml:
        name: '##default'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
  requestBodies:
    postagem:
      description: postagem object that needs to be added to the store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Postagem'
        application/xml:
          schema:
            $ref: '#/components/schemas/Postagem'
    
  securitySchemes:
    postagenstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://postagenstore3.swagger.io/oauth/authorize
          scopes:
            "write:postagens": modify postagens in your account
            "read:postagens": read your postagens
    api_key:
      type: apiKey
      name: api_key
      in: header
